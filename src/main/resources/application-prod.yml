spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinic_psych}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:25392552}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: WARN
    com.clinic: INFO