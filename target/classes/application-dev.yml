spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinic_psych}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:25392552}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    root: INFO
    com.clinic: DEBUG
    org.hibernate.SQL: DEBUG